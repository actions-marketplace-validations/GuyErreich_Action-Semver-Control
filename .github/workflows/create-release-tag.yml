name: Create Release Tag

# Ops recovery: create a release tag with the GitHub App token
# (human/user tokens cannot create tags under this repo's rulesets).
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag name (e.g. 1.4.6-rc)'
        required: true
        type: string
      target_ref:
        description: 'Branch or commit SHA to tag'
        required: true
        default: 'staging'
        type: string

permissions:
  contents: write

jobs:
  create-tag:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.target_ref }}
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure Git for App
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git

      - name: Create and push tag
        run: |
          set -euo pipefail
          TAG="${{ inputs.tag }}"
          if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
            echo "Tag ${TAG} already exists locally"
            exit 1
          fi
          git tag -a "${TAG}" -m "Release ${TAG}"
          git push origin "refs/tags/${TAG}"
          echo "Created and pushed tag ${TAG} at $(git rev-parse HEAD)"
