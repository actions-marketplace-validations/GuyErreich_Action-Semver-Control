name: Copyright Year Update

on:
  schedule:
    # 1 January 12:00 UTC
    - cron: "0 12 1 1 *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: copyright-year-${{ github.repository }}
  cancel-in-progress: false

jobs:
  update-copyright-year:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: dev
          fetch-depth: 0
          persist-credentials: false

      - name: Get GitHub App Token
        uses: ./.github/actions/app-authentication
        id: app-token
        with:
          client-id: ${{ vars.GH_APP_CLIENT_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Configure Git for App
        run: |
          git config user.name "${{ steps.app-token.outputs.user-name }}"
          git config user.email "${{ steps.app-token.outputs.user-email }}"
          git remote set-url origin https://x-access-token:${{ steps.app-token.outputs.token }}@github.com/${{ github.repository }}.git

      - name: Update copyright years
        id: update
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          set -euo pipefail
          END_YEAR="$(date -u +%Y)"
          echo "end_year=${END_YEAR}" >> "${GITHUB_OUTPUT}"
          python3 scripts/update_copyright_year.py --end-year "${END_YEAR}"
          if git diff --quiet; then
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            echo "Copyright years already up to date for ${END_YEAR}"
          else
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi

      - name: Open pull request
        if: steps.update.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          END_YEAR: ${{ steps.update.outputs.end_year }}
        run: |
          set -euo pipefail
          BRANCH="chore/copyright-year-${END_YEAR}"
          TITLE="chore: update copyright year to 2025-${END_YEAR}"
          git checkout -B "${BRANCH}"
          git add -A
          git commit -m "${TITLE}"
          git push -u origin "HEAD:${BRANCH}" --force-with-lease
          if /usr/bin/gh pr list --head "${BRANCH}" --base dev --json number --jq 'length' | grep -qx '0'; then
            /usr/bin/gh pr create --base dev --head "${BRANCH}" --title "${TITLE}" --body "$(cat <<EOF
          ## Summary

          - Bump copyright year range to \`2025-${END_YEAR}\` across LICENSE, \`.licenserc.yaml\`, \`.licenserc.runview.yaml\`, and SPDX headers.

          ## Notes

          - Scheduled New Year update (or manual workflow_dispatch).
          - Must pass \`license-check\` before merge; Auto Semver Bump runs after merge and includes these files.
          EOF
          )"
          else
            echo "PR for ${BRANCH} already exists"
          fi
