name: CI

permissions:
  contents: read

on:
  pull_request:
    branches:
      - staging
      - dev

jobs:
  ci:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.12', '3.13']
      fail-fast: false

    steps:
    - name: Checkout repository
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

    - name: Install uv
      uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
      with:
        enable-cache: true
        cache-dependency-glob: "uv.lock"
        python-version: ${{ matrix.python-version }}

    - name: Cache tool caches (mypy, ruff, pytest)
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          .mypy_cache
          .ruff_cache
          .pytest_cache
        key: ${{ runner.os }}-tool-caches-${{ matrix.python-version }}-${{ github.sha }}
        restore-keys: |
          ${{ runner.os }}-tool-caches-${{ matrix.python-version }}-

    - name: Cache Task binary
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: /usr/local/bin/task
        key: ${{ runner.os }}-task-${{ hashFiles('install-task.sh') }}

    - name: Install Task (Go task runner)
      run: ./install-task.sh

    - name: Install dependencies
      run: task install

    - name: Dependency audit
      run: task audit

    - name: Format code
      run: task format

    - name: Lint code
      run: task lint

    - name: Type check
      run: task type-check

    - name: Run tests
      run: task test