name: Validate Stateless App Token

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "X-GitHub-Stateless-S2S-Token override (enabled = JWT format, disabled = classic)"
        required: true
        type: choice
        options:
          - enabled
          - disabled

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Read uv pin
        id: uv-pin
        run: echo "version=$(tr -d '[:space:]' < .uv-version)" >> "$GITHUB_OUTPUT"

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"
          python-version: "3.12"
          version: ${{ steps.uv-pin.outputs.version }}

      - name: Install dependencies
        run: uv sync --frozen


      - name: Validate token format and consumers
        env:
          # Client ID is preferred for JWT iss; App ID still works as a fallback.
          GH_APP_CLIENT_ID: ${{ vars.GH_APP_CLIENT_ID }}
          GH_APP_ID: ${{ secrets.GH_APP_ID }}
          GH_APP_PRIVATE_KEY: ${{ secrets.GH_APP_PRIVATE_KEY }}
        run: |
          owner="${{ github.repository_owner }}"
          repo="${{ github.event.repository.name }}"
          uv run python scripts/validate_stateless_token.py \
            --mode "${{ inputs.mode }}" \
            --owner "${owner}" \
            --repo "${repo}"
