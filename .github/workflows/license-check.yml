name: License Header Check

on:
  push:
    branches: ["master", "staging", "dev"]
  pull_request:
    branches: ["master", "staging", "dev"]
  workflow_dispatch:

concurrency:
  group: license-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  license-check:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # Docker avoids nested unpinned actions inside apache/skywalking-eyes (e.g. setup-go@v5)
      # which fail when the repo requires full-length commit SHA pins.
      - name: Check license headers
        run: |
          docker run --rm \
            -v "$PWD:/github/workspace" \
            -w /github/workspace \
            apache/skywalking-eyes:0.8.0 \
            header check -c .licenserc.yaml
